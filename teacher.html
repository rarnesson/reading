<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lärarsida – Läsförståelse</title>
  <link rel="stylesheet" href="teacher.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="topbar">
    <h1>📚 Läsförståelse – Lärarsida</h1>

    <div class="filter">
      <label for="classSelect">Klass:</label>
      <select id="classSelect"></select>
    </div>

    <div class="actions">
      <button id="resetBtn">Nollställ statistik</button>
      <button onclick="window.location.href='owner.html'">Affär – lärarvy</button>
    </div>
  </div>

  <!-- Flikar för texttyper (utbyggbart) -->
  <div class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="normal" role="tab" aria-selected="true">Vanliga texter</button>
    <button type="button" class="tab" data-tab="fakta" role="tab" aria-selected="false">Faktatexter</button>
  </div>

  <!-- Wrapper så tabellen inte hamnar bakom scrollbaren -->
  <div class="table-wrapper">
    <div id="tableScroll" class="table-scroll">
      <table id="resultsTable">
        <thead>
          <tr id="headerRow"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Sticky scrollbar -->
  <div id="stickyScroll" class="sticky-scroll"></div>

  <script src="teacher.js"></script>
</body>
</html>
